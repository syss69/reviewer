name: Check
on: push
jobs:
  check:
    runs-on: self-hosted
    steps:
      - name: check
        uses: actions/checkout@v3
      - name: dependencies
        run: npm ci
      - name: lint
        run: npm run lint
  test:
    needs: [check]
    runs-on: self-hosted
    steps:
        - name: checkout
          uses: actions/checkout@v3
        - name: dependencies
          run: npm ci
        - name: test
          run: npm run test