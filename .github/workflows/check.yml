name: Check
on: push
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: check
        uses: actions/checkout@v3
      - name: dependencies
        run: npm ci
      - name: lint
        run: npm run lint
  test:
  needs: check
  runs-on: ubuntu-latest
  steps:
    - name: test
      run: npm run test